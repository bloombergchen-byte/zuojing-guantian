<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坐井观天</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="sky-edge-collage" aria-label="坐井观天">
 <div id="notice" class="notice" role="status" aria-live="polite">正在读取本机数据…</div>
 <section id="load-error" class="error-sheet" hidden><h2>本机数据未能读取</h2><p id="load-message"></p><p>原始记录保持在本机。原始封包供保全和排查，不能作为普通备份导入。</p><button id="raw-export" type="button">导出原始记录</button><button id="previous-raw" type="button">导出上次恢复前原始记录</button><button id="recovery-select" type="button">选择完整备份恢复</button><button id="retry-load" type="button">重试</button></section>
 <div class="op-stage">
  <div class="op-edge-gallery" role="group" aria-label="21张边缘原画"></div>
  <nav class="op-nav" aria-label="主页操作"><button type="button" class="op-search-toggle" aria-expanded="false">搜索 <kbd>/</kbd></button><button type="button" id="organize" aria-pressed="false">整理</button><button type="button" id="stats-open">访问统计</button><button type="button" id="settings-open">设置</button><button type="button" id="continue-draft" hidden>继续编辑</button></nav>
  <h1 class="op-title" aria-label="坐井观天"><span class="op-letter"><span>坐</span></span><span class="op-letter"><span>井</span></span><span class="op-letter"><span>观</span></span><span class="op-letter"><span>天</span></span></h1>
  <span class="op-rule" aria-hidden="true"></span>
  <main class="op-papers" aria-label="全部七个分类"></main>
  <section class="op-search" aria-label="搜索" hidden>
   <div class="op-search-tabs"><button type="button" data-mode="web" aria-pressed="true">搜全网</button><button type="button" data-mode="local" aria-pressed="false">找网站</button><button type="button" class="op-search-close">返回纸面</button></div>
   <form><label class="sr-only" for="search-input">搜索内容</label><input id="search-input" type="search" autocomplete="off" placeholder="搜索全网或输入网址"><select aria-label="搜索引擎"><option value="google">Google</option><option value="bing">Bing</option><option value="baidu">百度</option></select><button type="submit">搜索</button></form>
   <p class="op-search-result" role="status" aria-live="polite"></p>
  </section>
  <dialog class="op-folio" aria-label="原作画页"><header><button type="button" class="op-folio-prev">上一张</button><output></output><button type="button" class="op-folio-next">下一张</button><button type="button" class="op-folio-close">返回纸面</button></header><img alt=""></dialog>
 </div>
 <dialog id="editor" class="sheet-dialog" aria-labelledby="editor-title"><h2 id="editor-title">编辑网站</h2><form id="editor-form"><label>名称<input name="name" maxlength="120" required autocomplete="off"></label><label>网址<input name="url" maxlength="4096" required autocomplete="url" placeholder="https://"></label><label>分类<select name="group"></select></label><p id="editor-error" role="alert"></p><p id="draft-status" role="status"></p><div class="dialog-actions"><button type="submit">保存网站</button><button id="delete-site" type="button">移入收纳</button><button id="editor-close" type="button">返回纸面，保留草稿</button></div></form></dialog>
 <dialog id="settings" class="sheet-dialog" aria-labelledby="settings-title"><h2 id="settings-title">设置</h2><form id="settings-form"><label>默认搜索引擎<select name="engine"><option value="google">Google</option><option value="bing">Bing</option><option value="baidu">百度</option></select></label><label class="check-label"><input type="checkbox" name="openingEnabled">每日首次播放完整开场</label><label>原画存在感 <output id="presence-output">88%</output><input type="range" name="artPresence" min="55" max="100" step="1"></label><button type="submit">保存设置</button></form><div class="settings-actions"><button id="opening-replay" type="button">重播开场</button><button id="folio-open" type="button">查看画页</button><button id="trash-open" type="button">收纳与恢复</button><button id="chrome-import" type="button">读取当前 Chrome 书签</button><button id="seed-import" type="button">预览已保存书签与吉他入口</button><button id="file-import" type="button">从 JSON 导入</button><button id="backup-export" type="button">导出完整数据</button><button id="rollback" type="button">恢复上次替换前数据</button><button id="settings-raw" type="button">导出原始本机记录</button></div><p>数据只保存在本机。书签导入不会修改 Chrome 原始书签；统计只记录从本页发起的网站打开。</p><button type="button" data-close>返回纸面</button></dialog>
 <dialog id="importer" class="sheet-dialog wide-dialog" aria-labelledby="import-title"><h2 id="import-title">导入预览</h2><p id="import-source"></p><label>导入方式<select id="import-mode"><option value="merge">合并到当前数据</option><option value="replace">替换当前全部数据</option></select></label><label id="rollback-choice" class="check-label" hidden><input id="keep-rollback" type="checkbox" checked>保留一次替换前回退</label><p id="import-summary" role="status"></p><p id="import-warning" role="alert"></p><details id="import-skipped" hidden><summary>无法导入的来源条目及原因</summary><ul></ul></details><div id="import-groups"></div><p id="import-error" role="alert"></p><div class="dialog-actions"><button id="confirm-import" type="button">确认导入</button><button id="import-export" type="button">先导出当前数据</button><button id="cancel-import" type="button">取消</button></div></dialog>
 <dialog id="trash" class="sheet-dialog" aria-labelledby="trash-title"><h2 id="trash-title">收纳与恢复</h2><div id="trash-list"></div><button type="button" data-close>返回纸面</button></dialog>
 <dialog id="statistics" class="sheet-dialog wide-dialog" aria-labelledby="statistics-title"><h2 id="statistics-title">访问统计</h2><p>记录从主页发起的打开，不能说明目标网站已成功加载。</p><div id="stats-content"></div><div class="dialog-actions"><button id="stats-export" type="button">导出完整数据与统计</button><button id="stats-reset" type="button">重置统计</button><button type="button" data-close>返回纸面</button></div></dialog>
 <dialog id="confirmation" class="sheet-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">确认操作</h2><p id="confirm-message"></p><p id="confirm-error" role="alert"></p><button id="confirm-yes" type="button">确认</button><button type="button" data-close>取消</button></dialog>
 <input id="json-file" type="file" accept=".json,application/json" hidden>
 <noscript><p class="error-sheet">此扩展需要启用 JavaScript 才能读取本机数据。</p></noscript>
</div>
<script src="vendor/anime-4.5.0.umd.min.js"></script><script src="core.js"></script><script src="store.js"></script><script src="seed.js"></script><script src="motion.js"></script><script src="app.js"></script>
</body></html>
